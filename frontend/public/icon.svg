<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12121C"/>
      <stop offset="100%" stop-color="#0B0B12"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="30" y1="30" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EC4899" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background tile with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#303047" stroke-width="2"/>

  <!-- Cosmetic Bottle / Product Silhouette -->
  <g filter="url(#glow)">
    <!-- Bottle Cap -->
    <rect x="26" y="10" width="12" height="7" rx="2.5" fill="#F8FAFC" opacity="0.95"/>
    <rect x="29" y="17" width="6" height="3" fill="#A1A1B5"/>
    <!-- Bottle Shoulder & Body -->
    <path d="M22 23 C22 20 25 19 32 19 C39 19 42 20 42 23 L44 44 C44 48 40 50 32 50 C24 50 20 48 20 44 Z" fill="url(#brand-grad)"/>
    <!-- Inner Cosmetic Glow Highlight -->
    <path d="M24 25 C24 23 26 22 30 22 L30 46 C26 46 24 44 24 42 Z" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <!-- Verification Shield Badge with Checkmark at bottom right -->
  <g transform="translate(4, 2)">
    <!-- Shield Container -->
    <path d="M44 32 C44 32 44 44 38 48 C32 44 32 32 32 32 L38 30 Z" fill="#0B0B12" stroke="#191925" stroke-width="4"/>
    <path d="M44 32 C44 32 44 44 38 48 C32 44 32 32 32 32 L38 30 Z" fill="url(#shield-grad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Crisp Checkmark -->
    <path d="M35 39.5 L37.2 41.8 L41.5 36.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>