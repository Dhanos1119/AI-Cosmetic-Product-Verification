<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Rounded-square squircle background -->
  <rect width="512" height="512" rx="115" fill="url(#shieldGrad)" />

  <!-- White Shield Outline -->
  <path
    d="M 256,90 C 330,90 390,108 390,108 C 390,220 364,332 256,410 C 148,332 122,220 122,108 C 122,108 182,90 256,90 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- White Verification Check Symbol inside the shield -->
  <path
    d="M 188,245 L 238,295 L 328,205"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
